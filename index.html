  <style>
    :root {
      /* Dark mode follows the OS, no JS, no invert() hack */
      color-scheme: light dark;

      --bg: light-dark(#ffffff, #0d1117);
      --fg: light-dark(#1f2328, #e6edf3);
      --muted: light-dark(#59636e, #9198a1);
      --syntax: light-dark(#b6bec7, #4d5560);
      --border: light-dark(#d1d9e0, #30363d);
      --link: light-dark(#0969da, #4493f8);
      --code-bg: light-dark(#eff1f3, #2b3138);
      --mark: light-dark(#fff3c4, #4a3f14);

      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", "Noto Sans Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--fg);
      font: 400 1rem/1.65 var(--mono);
      font-variant-ligatures: none;
      text-align: left;
    }

    ::selection {
      background-color: var(--mark);
    }

    .page {
      max-inline-size: 46rem;
      margin: 0;
      padding-block: clamp(2rem, 7vw, 4rem);
      padding-inline: clamp(2.75rem, 8vw, 4rem) clamp(1.25rem, 5vw, 2rem);
    }

    /* Markdown source markers live in the left gutter */
    :where(h1, h2, li, blockquote)::before {
      position: absolute;
      inset-inline-end: 100%;
      padding-inline-end: 0.5em;
      color: var(--syntax);
      font-weight: 400;
      user-select: none;
    }

    .md {
      h1, h2, p, ul, blockquote, hr {
        margin-block: 0 1rem;
      }

      h1, h2 {
        position: relative;
        margin-block-start: 1.75rem;
        font-weight: 600;
        line-height: 1.25;
        text-wrap: balance;

        &:first-child {
          margin-block-start: 0;
        }
      }

      h1 {
        font-size: clamp(1.75rem, 5vw, 2.2rem);
        padding-block-end: 0.3em;
        border-block-end: 1px solid var(--border);

        &::before {
          content: "#";
        }
      }

      h2 {
        font-size: clamp(1.1rem, 3.5vw, 1.3rem);
        color: var(--muted);

        &::before {
          content: "##";
        }
      }

      p {
        text-wrap: pretty;
      }

      hr {
        block-size: 1px;
        margin-block: 2rem;
        border: 0;
        background-color: var(--border);
      }

      code {
        padding: 0.15em 0.4em;
        border-radius: 6px;
        background-color: var(--code-bg);
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        margin-block-end: 0.35rem;

        &::before {
          content: "-";
        }
      }

      blockquote {
        position: relative;
        margin-inline: 0;
        padding-inline-start: 1rem;
        border-inline-start: 0.25rem solid var(--border);
        color: var(--muted);
        font-size: 0.9375rem;

        &::before {
          content: ">";
        }
      }

      a {
        color: var(--link);
        text-decoration: none;

        &:hover, &:active {
          text-decoration: underline;
          text-underline-offset: 0.15em;
        }

        &:focus-visible {
          outline: 2px solid var(--link);
          outline-offset: 3px;
          border-radius: 3px;
        }
      }
    }
  </style>
</head>
<body>
<div class="page">
  <article class="md">
    <header role="banner">
      <h1>Hello.</h1>
      <h2>My name is Ankur</h2>
    </header>

    <main role="main">
      <p>
        I am a Cloud Platform Engineer from India. <br>
        Everywhere that matters, I am <code>@ankurk91</code>
      </p>
    </main>

    <hr>

    <footer role="contentinfo">
      <h2>I am social, not really.</h2>

      <ul class="links">
        <li><a target="_blank" rel="noopener" title="GitHub" href="https://github.com/ankurk91">GitHub</a></li>
        <li><a target="_blank" rel="noopener" title="Twitter" href="https://twitter.com/ankurk91">Twitter</a></li>
        <li><a target="_blank" rel="noopener" title="npm" href="https://www.npmjs.com/~ankurk91">npm</a></li>
        <li><a target="_blank" rel="noopener" title="dev.to" href="https://dev.to/ankurk91">DEV</a></li>
        <li><a href="#" id="jsMail" title="eMail"
               data-local="1krukna.orp"
               data-plus="+github"
               data-domain="gmail"
               data-tld=".com">E-Mail</a></li>
      </ul>

      <blockquote>No personal support over emails/twitter please. :)</blockquote>
    </footer>
  </article>
</div>
<script>
  {
    const link = document.querySelector('#jsMail');
    const {local, plus, domain, tld} = link.dataset;
    link.href = `mailto:${[...local].reverse().join('')}${plus}@${domain}${tld}`;
  }
</script>
