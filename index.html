  <style>
    :root {
      /* Dark mode follows the OS, no JS, no invert() hack */
      color-scheme: light dark;

      --bg: light-dark(#ffffff, #0d1117);
      --fg: light-dark(#1f2328, #e6edf3);
      --muted: light-dark(#59636e, #9198a1);
      --syntax: light-dark(#b6bec7, #4d5560);
      --border: light-dark(#d1d9e0, #30363d);
      --link: light-dark(#0969da, #4493f8);
      --code-bg: light-dark(#eff1f3, #2b3138);
      --mark: light-dark(#fff3c4, #4a3f14);

      --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "Noto Sans", sans-serif,
      "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji";
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
      "Liberation Mono", monospace;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--fg);
      font: 400 1rem/1.65 var(--sans);
      text-align: left;
    }

    ::selection {
      background-color: var(--mark);
    }

    .page {
      max-inline-size: 46rem;
      margin: 0;
      padding-block: clamp(2rem, 7vw, 4rem);
      padding-inline: clamp(2.75rem, 8vw, 4rem) clamp(1.25rem, 5vw, 2rem);
    }

    /* Markdown source markers live in the left gutter */
    :where(h1, h2, li, blockquote)::before {
      position: absolute;
      inset-inline-end: 100%;
      padding-inline-end: 0.5em;
      color: var(--syntax);
      font: 400 0.9em/inherit var(--mono);
      user-select: none;
    }

    .md {
      h1, h2, p, ul, blockquote, hr {
        margin-block: 0 1rem;
      }

      h1, h2 {
        position: relative;
        margin-block-start: 1.75rem;
        font-weight: 600;
        line-height: 1.25;
        text-wrap: balance;

        &:first-child {
          margin-block-start: 0;
        }
      }

      h1 {
        font-size: clamp(1.9rem, 5vw, 2.4rem);
        padding-block-end: 0.3em;
        border-block-end: 1px solid var(--border);

        &::before {
          content: "#";
        }
      }

      h2 {
        font-size: clamp(1.2rem, 3.5vw, 1.4rem);
        color: var(--muted);

        &::before {
          content: "##";
        }
      }

      p {
        text-wrap: pretty;
      }

      hr {
        block-size: 1px;
        margin-block: 2rem;
        border: 0;
        background-color: var(--border);
      }

      code {
        padding: 0.15em 0.4em;
        border-radius: 6px;
        background-color: var(--code-bg);
        font-family: var(--mono);
        font-size: 0.875em;
      }

      ul {
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        margin-block-end: 0.35rem;

        &::before {
          content: "-";
        }
      }

      blockquote {
        position: relative;
        margin-inline: 0;
        padding-inline-start: 1rem;
        border-inline-start: 0.25rem solid var(--border);
        color: var(--muted);
        font-size: 0.9375rem;

        &::before {
          content: ">";
        }
      }

      a {
        color: var(--link);
        text-decoration: none;

        &:hover, &:active {
          text-decoration: underline;
          text-underline-offset: 0.15em;
        }

        &:focus-visible {
          outline: 2px solid var(--link);
          outline-offset: 3px;
          border-radius: 3px;
        }
      }
    }

    .brand {
      color: var(--brand, currentColor);
      font-weight: 600;
    }

    .b-github {
      --brand: light-dark(#24292f, #e6edf3);
    }

    .b-twitter {
      --brand: #1da1f2;
    }

    .b-npm {
      --brand: #c12127;
    }

    .b-dev {
      --brand: light-dark(#24292f, #e6edf3);
    }

    .b-mail {
      --brand: #dc4937;
    }
  </style>
</head>

<script>

</script>

</html>
